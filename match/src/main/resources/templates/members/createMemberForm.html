<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - Match</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #f8f9fa; }
        .container { max-width: 480px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { color: #004085; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #495057; }
        .input-group { display: flex; gap: 8px; }
        input { flex: 1; padding: 10px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; }
        .btn-side { padding: 10px 14px; background-color: #6c757d; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .btn-side:hover { background-color: #5a6268; }
        .btn-submit { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn-submit:disabled { background-color: #ccc; cursor: not-allowed; }
        .error-msg { color: #dc3545; font-size: 0.85em; margin-top: 5px; }
        .success-msg { color: #28a745; font-size: 0.85em; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎓 회원가입</h2>

    <form action="/members/new" method="post" id="signupForm">
        <!-- 이메일 입력 및 인증 요청 -->
        <div class="form-group">
            <label for="email">학교 이메일 (@shinhan.ac.kr)</label>
            <div class="input-group">
                <input type="email" id="email" name="email" placeholder="example@shinhan.ac.kr" required>
                <button type="button" class="btn-side" onclick="sendCode()">인증 요청</button>
            </div>
            <div id="emailMsg"></div>
            <div th:if="${error != null}" class="error-msg" th:text="${error}"></div>
        </div>

        <!-- 인증번호 입력 -->
        <div class="form-group" id="codeGroup" style="display: none;">
            <label for="authCode">인증번호 6자리</label>
            <div class="input-group">
                <input type="text" id="authCode" placeholder="콘솔에 출력된 6자리 번호">
                <button type="button" class="btn-side" onclick="verifyCode()">인증 확인</button>
            </div>
            <div id="codeMsg"></div>
        </div>

        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" placeholder="비밀번호 입력" required>
        </div>

        <div class="form-group">
            <label for="name">이름 / 닉네임</label>
            <input type="text" id="name" name="name" placeholder="홍길동" required>
        </div>

        <div class="form-group">
            <label for="department">학과</label>
            <input type="text" id="department" name="department" placeholder="예: 컴퓨터공학전공" required>
        </div>

        <!-- 인증 완료 전까지 가입 버튼 비활성화 -->
        <button type="submit" id="submitBtn" class="btn-submit" disabled>이메일 인증 완료 후 가입 가능</button>
    </form>
</div>

<script>
    let isEmailVerified = false;

    function sendCode() {
        const email = document.getElementById("email").value;
        const msgDiv = document.getElementById("emailMsg");

        if (!email.endsWith("@shinhan.ac.kr")) {
            msgDiv.className = "error-msg";
            msgDiv.innerText = "신한대학교 이메일(@shinhan.ac.kr) 형식이어야 합니다.";
            return;
        }

        fetch("/members/mail/send?email=" + encodeURIComponent(email), { method: "POST" })
            .then(res => res.text())
            .then(data => {
                msgDiv.className = "success-msg";
                msgDiv.innerText = "인증번호가 발송되었습니다. (콘솔창을 확인하세요!)";
                document.getElementById("codeGroup").style.display = "block";
            });
    }

    function verifyCode() {
        const email = document.getElementById("email").value;
        const code = document.getElementById("authCode").value;
        const msgDiv = document.getElementById("codeMsg");

        fetch("/members/mail/verify?email=" + encodeURIComponent(email) + "&code=" + encodeURIComponent(code), { method: "POST" })
            .then(res => res.json())
            .then(isSuccess => {
                if (isSuccess) {
                    msgDiv.className = "success-msg";
                    msgDiv.innerText = "✅ 이메일 인증이 완료되었습니다.";
                    isEmailVerified = true;
                    document.getElementById("submitBtn").disabled = false;
                    document.getElementById("submitBtn").innerText = "가입하기";
                    document.getElementById("email").readOnly = true;
                    document.getElementById("authCode").readOnly = true;
                } else {
                    msgDiv.className = "error-msg";
                    msgDiv.innerText = "❌ 인증번호가 일치하지 않습니다.";
                }
            });
    }
</script>

</body>
</html>
