<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>모집글 상세 보기</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5" style="max-width: 800px;">
    <h2 class="mb-4">모집글 상세 보기</h2>

    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <div>
                <span class="badge bg-info text-dark me-2" th:if="${post.category != null}" th:text="${post.category.description}">분류</span>
                <h4 class="d-inline align-middle mb-0" th:text="${post.title}">게시글 제목</h4>
            </div>
            <small class="text-muted" th:if="${post.createdDate != null}"
                   th:text="${#temporals.format(post.createdDate, 'yyyy-MM-dd HH:mm')}">2026-09-25 12:00</small>
        </div>
        <div class="card-body">
            <div class="mb-3 text-end text-secondary">
                작성자: <span class="fw-bold" th:text="${post.author}">작성자</span>
            </div>
            <hr>
            <div class="card-text my-4" style="white-space: pre-line;" th:text="${post.content}">
                상세 내용이 들어가는 자리입니다.
            </div>
        </div>
    </div>

    <div class="d-flex gap-2">
        <a th:href="@{/posts}" class="btn btn-secondary">목록으로</a>
        <a th:href="@{/posts/{id}/edit(id=${post.id})}"
           th:if="${session.loginMember != null and session.loginMember == post.author}"
           class="btn btn-warning">수정</a>
        <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post"
              th:if="${session.loginMember != null and session.loginMember == post.author}"
              onsubmit="return confirm('정말 삭제하시겠습니까?');">
            <button type="submit" class="btn btn-danger">삭제</button>
        </form>
    </div>
</div>
</body>
</html>
