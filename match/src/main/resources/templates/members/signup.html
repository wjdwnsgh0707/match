<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5" style="max-width: 500px;">
    <h2 class="mb-4 text-center">회원가입</h2>
    <form th:action="@{/members/signup}" method="post" id="signupForm">
        <div class="mb-3">
            <label for="username" class="form-label">아이디</label>
            <input type="text" id="username" name="username" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="nickname" class="form-label">닉네임</label>
            <input type="text" id="nickname" name="nickname" class="form-control" required>
        </div>

        <!-- 이메일 및 인증번호 영역 -->
        <div class="mb-3">
            <label for="email" class="form-label">이메일</label>
            <div class="input-group">
                <input type="email" id="email" name="email" class="form-control" placeholder="example@gmail.com" required>
                <button type="button" class="btn btn-outline-secondary" onclick="sendCode()">인증번호 전송</button>
            </div>
        </div>

        <div class="mb-3">
            <label for="authCode" class="form-label">인증번호</label>
            <div class="input-group">
                <input type="text" id="authCode" class="form-control" placeholder="6자리 입력">
                <button type="button" class="btn btn-outline-success" onclick="verifyCode()">인증 확인</button>
            </div>
            <small id="authResult" class="form-text"></small>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-success w-100 mt-3" disabled>가입하기</button>
    </form>
</div>

<script>
    let isEmailVerified = false;

    function sendCode() {
        const email = document.getElementById('email').value;
        if (!email) {
            alert('이메일을 입력해주세요.');
            return;
        }

        fetch('/members/send-code?email=' + encodeURIComponent(email), {
            method: 'POST'
        })
            .then(response => response.text())
            .then(data => {
                alert(data);
            })
            .catch(err => alert('발송 실패: ' + err));
    }

    function verifyCode() {
        const email = document.getElementById('email').value;
        const code = document.getElementById('authCode').value;

        fetch(`/members/verify-code?email=${encodeURIComponent(email)}&code=${encodeURIComponent(code)}`, {
            method: 'POST'
        })
            .then(response => response.json())
            .then(isMatched => {
                const resultMsg = document.getElementById('authResult');
                if (isMatched) {
                    resultMsg.style.color = 'green';
                    resultMsg.innerText = '인증에 성공했습니다.';
                    document.getElementById('submitBtn').disabled = false;
                    document.getElementById('email').readOnly = true;
                    document.getElementById('authCode').readOnly = true;
                } else {
                    resultMsg.style.color = 'red';
                    resultMsg.innerText = '인증번호가 일치하지 않습니다.';
                }
            });
    }
</script>
</body>
</html>
