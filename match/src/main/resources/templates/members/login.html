<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5" style="max-width: 400px;">
    <h2 class="mb-4 text-center">로그인</h2>

    <!-- 로그인 실패 시 메시지 노출 -->
    <div th:if="${loginError}" class="alert alert-danger" role="alert" th:text="${loginError}">
        아이디 또는 비밀번호가 올바르지 않습니다.
    </div>

    <form th:action="@{/members/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">아이디</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="아이디 입력" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="비밀번호 입력" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">로그인</button>
        <div class="mt-3 text-center">
            <a th:href="@{/members/signup}">회원가입 하러가기</a>
        </div>
    </form>
</div>
</body>
</html>
