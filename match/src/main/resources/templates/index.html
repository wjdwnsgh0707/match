<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>신한대 팀원 매칭 플랫폼</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding-top: 80px;
            background-color: #f8f9fa;
        }
        .container {
            background-color: white;
            display: inline-block;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { color: #0056b3; }
        p { color: #6c757d; font-size: 1.1rem; }
        .badge {
            background-color: #28a745;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .btn-board {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 24px;
            background-color: #0056b3;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
        .btn-board:hover {
            background-color: #004085;
        }
    </style>
</head>
<body>
<div class="container">
    <span class="badge">Shinhan University Capstone</span>
    <h1>신한대학교 공모전/스터디 매칭 플랫폼</h1>
    <p>백엔드 서버가 성공적으로 작동 중입니다! 🚀</p>

    <!-- 게시판으로 이동하는 버튼 -->
    <a href="/posts" class="btn-board">📢 팀원 모집 게시판 바로가기</a>
</div>
</body>
</html>
