<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title><!DOCTYPE html>
        <html xmlns:th="http://www.thymeleaf.org">
        <head>
        <meta charset="UTF-8">
        <title>모집글 작성</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5" style="max-width: 800px;">
    <h2 class="mb-4">새 모집글 작성</h2>

    <form th:action="@{/posts/new}" method="post">
        <div class="mb-3">
            <label for="category" class="form-label">모집 구분</label>
            <select id="category" name="category" class="form-select" required>
                <option value="">-- 카테고리 선택 --</option>
                <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat.description}">공모전</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="title" class="form-label">제목</label>
            <input type="text" id="title" name="title" class="form-control" placeholder="제목을 입력하세요" required>
        </div>

        <div class="mb-3">
            <label for="author" class="form-label">작성자</label>
            <input type="text" id="author" name="author" class="form-control" th:value="${post.author}" readonly>
        </div>

        <div class="mb-3">
            <label for="content" class="form-label">상세 내용 (역할, 기간, 진행 방식 등)</label>
            <textarea id="content" name="content" class="form-control" rows="7" placeholder="모집 요건과 설명 내용을 작성하세요" required></textarea>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">등록하기</button>
            <a th:href="@{/posts}" class="btn btn-secondary">취소</a>
        </div>
    </form>
</div>
</body>
</html></title>
</head>
<body>

</body>
</html>
