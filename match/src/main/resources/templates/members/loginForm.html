<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 - Match</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #f8f9fa; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { color: #004085; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #495057; }
        input { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background-color: #004085; }
        .error-msg { color: #dc3545; font-size: 0.85em; margin-top: 5px; text-align: center; }
        .signup-link { text-align: center; margin-top: 15px; font-size: 0.9em; }
        .signup-link a { color: #0056b3; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔑 로그인</h2>

    <form action="/members/login" method="post">
        <div class="form-group">
            <label for="email">학교 이메일</label>
            <input type="email" id="email" name="email" placeholder="example@shinhan.ac.kr" required>
        </div>

        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" placeholder="비밀번호 입력" required>
        </div>

        <div th:if="${error != null}" class="error-msg" th:text="${error}"></div>

        <button type="submit" class="btn-submit">로그인</button>
    </form>

    <div class="signup-link">
        아직 계정이 없으신가요? <a href="/members/new">회원가입</a>
    </div>
</div>

</body>
</html>
