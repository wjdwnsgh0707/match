<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 작성</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">게시글 작성</h2>

    <form th:action="@{/posts/new}" method="post">
        <div class="mb-3">
            <label for="title" class="form-label">제목</label>
            <input type="text" id="title" name="title" class="form-control" placeholder="제목을 입력하세요" required>
        </div>

        <div class="mb-3">
            <label for="author" class="form-label">작성자</label>
            <!-- writer가 아닌 author로 전송 -->
            <input type="text" id="author" name="author" class="form-control" placeholder="작성자 이름을 입력하세요" required>
        </div>

        <div class="mb-3">
            <label for="content" class="form-label">내용</label>
            <textarea id="content" name="content" class="form-control" rows="5" placeholder="내용을 입력하세요"></textarea>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">등록</button>
            <a th:href="@{/posts}" class="btn btn-secondary">취소</a>
        </div>
    </form>
</div>
</body>
</html>
