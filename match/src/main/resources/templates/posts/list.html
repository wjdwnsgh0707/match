<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>모임 및 팀원 모집</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>팀원 & 스터디 모집</h2>
        <div>
            <span th:if="${session.loginMember != null}" class="me-3">
                <b th:text="${session.loginMember}">사용자</b>님 환영합니다!
                <a th:href="@{/members/logout}" class="btn btn-outline-danger btn-sm ms-2">로그아웃</a>
            </span>
            <span th:if="${session.loginMember == null}">
                <a th:href="@{/members/login}" class="btn btn-outline-primary btn-sm">로그인</a>
                <a th:href="@{/members/signup}" class="btn btn-primary btn-sm">회원가입</a>
            </span>
        </div>
    </div>

    <!-- 카테고리 필터 탭 -->
    <ul class="nav nav-pills mb-4">
        <li class="nav-item">
            <a class="nav-link" th:classappend="${selectedCategory == null} ? 'active'" th:href="@{/posts}">전체</a>
        </li>
        <li class="nav-item" th:each="cat : ${categories}">
            <a class="nav-link"
               th:classappend="${selectedCategory == cat} ? 'active'"
               th:href="@{/posts(category=${cat})}"
               th:text="${cat.description}">카테고리</a>
        </li>
    </ul>

    <div class="d-flex justify-content-end mb-3">
        <a th:href="@{/posts/new}" class="btn btn-success">모집글 작성</a>
    </div>

    <table class="table table-hover">
        <thead class="table-light">
        <tr>
            <th>번호</th>
            <th>분류</th>
            <th>제목</th>
            <th>작성자</th>
            <th>작성일</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="post : ${posts}">
            <td th:text="${post.id}">1</td>
            <td>
                <span class="badge bg-info text-dark" th:if="${post.category != null}" th:text="${post.category.description}">분류</span>
            </td>
            <td>
                <a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}" class="text-decoration-none">제목 예시</a>
            </td>
            <td th:text="${post.author}">작성자</td>
            <td th:text="${post.createdDate != null ? #temporals.format(post.createdDate, 'yyyy-MM-dd') : '-'}">2026-09-25</td>
        </tr>
        <tr th:if="${#lists.isEmpty(posts)}">
            <td colspan="5" class="text-center text-muted py-4">등록된 모집글이 없습니다.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
