<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>팀원 모집 게시판 - Match</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #f8f9fa; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { color: #004085; font-size: 24px; margin-bottom: 20px; }

        .btn-create { display: inline-block; padding: 10px 18px; background-color: #0056b3; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; margin-bottom: 20px; }
        .btn-create:hover { background-color: #004085; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 14px 10px; text-align: left; border-bottom: 1px solid #e9ecef; }
        th { background-color: #f1f3f5; color: #495057; font-weight: 600; }

        .badge { display: inline-block; padding: 4px 8px; background-color: #e7f5ff; color: #1c7ed6; border-radius: 4px; font-size: 0.85em; font-weight: bold; }

        /* 제목 링크 스타일 깔끔하게 정리 */
        .post-title { color: #212529; text-decoration: none; font-weight: 600; }
        .post-title:hover { color: #1c7ed6; text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h1>📢 팀원 모집 게시판</h1>

    <a href="/posts/new" class="btn-create">+ 새 모집글 작성하기</a>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1>📢 팀원 모집 게시판</h1>

        <div>
            <!-- 로그인 안 된 상태 -->
            <div th:if="${loginMember == null}">
                <a href="/members/login" style="margin-right: 10px; color: #0056b3; text-decoration: none; font-weight: bold;">로그인</a>
                <a href="/members/new" style="color: #28a745; text-decoration: none; font-weight: bold;">회원가입</a>
            </div>

            <!-- 로그인 된 상태 -->
            <div th:if="${loginMember != null}" style="display: flex; align-items: center; gap: 10px;">
                <span style="font-weight: bold;" th:text="${loginMember.name} + '님 (' + ${loginMember.department} + ')'">홍길동님</span>
                <form action="/members/logout" method="post" style="margin: 0;">
                    <button type="submit" style="background: none; border: 1px solid #dc3545; color: #dc3545; padding: 4px 10px; border-radius: 4px; cursor: pointer;">로그아웃</button>
                </form>
            </div>
        </div>
    </div>

    <table>
        <thead>
        <tr>
            <th style="width: 8%;">번호</th>
            <th style="width: 12%;">구분</th>
            <th style="width: 45%;">제목</th>
            <th style="width: 20%;">모집 분야</th>
            <th style="width: 15%;">작성자</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="post : ${posts}">
            <td th:text="${post.id}">1</td>
            <td>
                <span class="badge" th:text="${post.category}">공모전</span>
            </td>
            <!-- 🔗 제목 자체에 링크를 적용한 부분 -->
            <td>
                <a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}" class="post-title">
                    모집글 제목이 들어가는 자리입니다.
                </a>
            </td>
            <td th:text="${post.position}">백엔드 1명</td>
            <td th:text="${post.writer}">작성자</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
