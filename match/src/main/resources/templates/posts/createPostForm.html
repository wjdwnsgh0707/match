<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>새 모집글 작성 - Match</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #f8f9fa; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { color: #004085; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #495057; }
        input[type="text"], select, textarea { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; }
        textarea { height: 120px; resize: vertical; }
        .btn-submit { display: inline-block; padding: 10px 20px; background-color: #0056b3; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-cancel { display: inline-block; padding: 10px 20px; background-color: #6c757d; color: white; text-decoration: none; border-radius: 6px; margin-left: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>✍️ 새 팀원 모집글 작성</h2>

    <!-- ⚠️ 파일 전송을 위해 enctype="multipart/form-data" 필수 추가! -->
    <form action="/posts/new" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label for="category">구분</label>
            <select name="category" id="category">
                <option value="공모전">공모전</option>
                <option value="스터디">스터디</option>
                <option value="프로젝트">프로젝트</option>
            </select>
        </div>

        <div class="form-group">
            <label for="title">글 제목</label>
            <input type="text" id="title" name="title" placeholder="예: [신한대] 2026 AI 해커톤 팀원 모집" required>
        </div>

        <div class="form-group">
            <label for="writer">작성자</label>
            <input type="text" id="writer" name="writer" placeholder="이름 또는 닉네임" required>
        </div>

        <div class="form-group">
            <label for="position">모집 분야</label>
            <input type="text" id="position" name="position" placeholder="예: 백엔드 1명, 디자이너 1명" required>
        </div>

        <!-- 🖼️ 파일 업로드 입력창 추가 -->
        <div class="form-group">
            <label for="imageFile">공모전/스터디 포스터 이미지 첨부</label>
            <input type="file" id="imageFile" name="imageFile" accept="image/*">
        </div>

        <div class="form-group">
            <label for="content">상세 내용</label>
            <textarea id="content" name="content" placeholder="팀원 모집에 관한 자세한 내용을 적어주세요."></textarea>
        </div>

        <button type="submit" class="btn-submit">등록하기</button>
        <a href="/posts" class="btn-cancel">취소</a>
    </form>
</div>

</body>
</html>
